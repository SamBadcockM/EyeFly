kind = "web"
previewPath = "/"
title = "Eyefly Route Builder"
description = "Plan airport-to-airport routes, discover named points of interest along the corridor, view them on a map, and export route and POI data to Excel."
version = "1.0.0"
id = "artifacts/eyefly-route-builder"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20010

[services.development]
run = "pnpm --filter @workspace/eyefly-route-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eyefly-route-builder", "run", "build" ]
serve = "static"
publicDir = "artifacts/eyefly-route-builder/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20010"
BASE_PATH = "/"
